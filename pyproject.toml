[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyremind-ai"
version = "0.1.0"
description = "Synthetic tyre monitoring proof of concept"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3"]

[project.scripts]
tyremind-load = "tyremind.database.load:main"
tyremind-preprocess = "tyremind.data.preprocess:main"
tyremind-generate = "tyremind.data.generate:main"

[tool.setuptools.packages.find]
where = ["src"]
